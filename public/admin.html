<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片处理 - 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}

/* 登录 */
.login-box{max-width:380px;margin:120px auto;background:#1a1a2e;border-radius:16px;padding:40px;border:1px solid #2a2a4a;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login-box h1{text-align:center;color:#ff6b9d;margin-bottom:8px;font-size:24px}
.login-box .sub{text-align:center;color:#666;margin-bottom:28px;font-size:13px}
.login-box input{width:100%;background:#0f0f1a;border:1px solid #2a2a4a;color:#e0e0e0;padding:12px;border-radius:8px;margin-bottom:14px;font-size:14px;outline:none}
.login-box input:focus{border-color:#ff6b9d}
.login-box button{width:100%;background:#ff6b9d;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.login-box button:hover{background:#e85d8a}
.login-box .err{color:#f55;text-align:center;margin-top:10px;font-size:13px;min-height:20px}

/* 导航 */
nav{background:#1a1a2e;padding:0 24px;display:flex;gap:4px;align-items:center;border-bottom:1px solid #2a2a4a;height:52px}
nav h1{font-size:16px;margin-right:auto;color:#ff6b9d}
nav a,nav button{background:transparent;color:#888;border:none;padding:14px 18px;cursor:pointer;font-size:13px;text-decoration:none;border-bottom:2px solid transparent}
nav a.active,nav button.active{color:#ff6b9d;border-bottom-color:#ff6b9d}
nav .logout{margin-left:auto;color:#f55;cursor:pointer;font-size:13px}

main{max-width:1300px;margin:0 auto;padding:24px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#1a1a2e;border-radius:10px;padding:18px;text-align:center;border:1px solid #2a2a4a}
.stat .num{font-size:26px;font-weight:700;color:#ff6b9d}
.stat .label{font-size:12px;color:#888;margin-top:4px}

.card{background:#1a1a2e;border-radius:14px;padding:24px;margin-bottom:24px;border:1px solid #2a2a4a}
.card h2{font-size:15px;margin-bottom:18px;color:#ff6b9d}
.flex-b{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 8px;border-bottom:1px solid #2a2a4a;color:#888;font-weight:500}
td{padding:10px 8px;border-bottom:1px solid #1f1f3a;vertical-align:middle}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.bg-done{background:#1a3a1a;color:#5f5}
.bg-proc{background:#3a3a1a;color:#ff5}
.bg-off{background:#3a1a1a;color:#f55}
.bg-on{background:#1a3a1a;color:#5f5}

.btn{background:#ff6b9d;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{background:#e04040}
.btn-outline{background:transparent;border:1px solid #ff6b9d;color:#ff6b9d}
.btn-gray{background:#333;color:#aaa}
input,select{background:#0f0f1a;border:1px solid #2a2a4a;color:#e0e0e0;padding:8px 12px;border-radius:6px;font-size:13px;outline:none}
input:focus{border-color:#ff6b9d}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* 缩略图 */
.thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid #2a2a4a;transition:border-color .2s}
.thumb:hover{border-color:#ff6b9d}
.thumb-cell{width:70px}

/* 大图预览 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.overlay img{max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.overlay .close{position:absolute;top:20px;right:24px;color:#fff;font-size:32px;cursor:pointer;opacity:.7}
.overlay .close:hover{opacity:1}

.tab-content{display:none}
.tab-content.active{display:block}
.toast{position:fixed;top:20px;right:20px;background:#ff6b9d;color:#fff;padding:12px 20px;border-radius:8px;z-index:99999;font-size:14px}
.hidden{display:none!important}
.empty{text-align:center;padding:40px;color:#666}
code{background:#0f0f1a;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page">
  <div class="login-box">
    <h1>🖼️ 图片处理</h1>
    <div class="sub">后台管理系统</div>
    <input id="lu" placeholder="账号" value="admin">
    <input id="lp" type="password" placeholder="密码" value="123456" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
    <div id="lerr" class="err"></div>
  </div>
</div>

<!-- 管理界面 -->
<div id="admin-page" class="hidden">
<nav>
  <h1>🖼️ 后台管理</h1>
  <a href="#" id="nt-keys" class="active" onclick="st('keys');return false">🔑 密钥管理</a>
  <a href="#" id="nt-jobs" onclick="st('jobs');return false">📋 处理记录</a>
  <span class="logout" onclick="logout()">退出</span>
</nav>
<main>
  <div id="stats-bar" class="stats"></div>

  <!-- 密钥 TAB -->
  <div id="tab-keys" class="tab-content active">
    <div class="card">
      <div class="flex-b"><h2>🔑 API 密钥列表</h2><button class="btn" onclick="showAdd()">+ 生成密钥</button></div>
      <div id="kf-add" style="display:none" class="form-row">
        <input id="kf-key" placeholder="密钥（留空自动生成）" style="width:200px">
        <input id="kf-label" placeholder="备注/给谁用">
        <input id="kf-quota" type="number" value="100" style="width:80px" placeholder="配额">
        <button class="btn" onclick="addKey()">确认</button>
        <button class="btn btn-outline" onclick="hideAdd()">取消</button>
      </div>
      <table><thead><tr><th>标签</th><th>密钥</th><th>配额</th><th>已用</th><th>剩余</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="keys-tb"><tr><td colspan="7" class="empty">加载中...</td></tr></tbody></table>
    </div>
  </div>

  <!-- 作业 TAB -->
  <div id="tab-jobs" class="tab-content">
    <div class="card">
      <div class="flex-b"><h2>📋 处理记录</h2><button class="btn btn-outline btn-sm" onclick="clearJobs()">🗑 清空</button></div>
      <div id="jobs-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px">
        <div class="empty" style="grid-column:1/-1">暂无记录</div>
      </div>
    </div>
  </div>
</main>
</div>

<!-- 大图预览 -->
<div id="preview" class="overlay hidden" onclick="closePreview()">
  <span class="close">&times;</span>
  <img id="preview-img" src="">
</div>

<script>
const API='/.netlify/functions/admin';
let tok=localStorage.getItem('at'), ct='keys';

async function doLogin(){
  const u=document.getElementById('lu').value,p=document.getElementById('lp').value;
  try{
    const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!d.ok){document.getElementById('lerr').textContent=d.error;return}
    tok=d.token;localStorage.setItem('at',tok);showAdmin();
  }catch(e){document.getElementById('lerr').textContent='网络错误'}
}
function logout(){localStorage.removeItem('at');tok=null;document.getElementById('login-page').classList.remove('hidden');document.getElementById('admin-page').classList.add('hidden')}
function showAdmin(){document.getElementById('login-page').classList.add('hidden');document.getElementById('admin-page').classList.remove('hidden');loadAll()}

async function call(act,body){
  const r=await fetch(API+'?action='+act,{
    method:body?'POST':'GET',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},
    body:body?JSON.stringify(body):undefined
  });
  if(r.status===401){logout();throw new Error('未登录')}
  return r.json()
}

async function loadAll(){loadStats();loadKeys();if(ct==='jobs')loadJobs()}
async function loadStats(){
  try{const d=await call('stats');const s=d.stats;
    document.getElementById('stats-bar').innerHTML=`
      <div class="stat"><div class="num">${s.totalKeys}</div><div class="label">密钥数</div></div>
      <div class="stat"><div class="num">${s.totalQuota-s.totalUsed}</div><div class="label">剩余配额</div></div>
      <div class="stat"><div class="num">${s.totalJobs}</div><div class="label">总作业</div></div>
      <div class="stat"><div class="num">${s.doneJobs}</div><div class="label">已完成</div></div>
      <div class="stat"><div class="num">${s.processingJobs}</div><div class="label">处理中</div></div>`}catch(e){}
}
async function loadKeys(){
  try{const d=await call('listKeys');const t=document.getElementById('keys-tb');
    if(!d.keys?.length){t.innerHTML='<tr><td colspan="7" class="empty">暂无密钥，请生成</td></tr>';return}
    t.innerHTML=d.keys.map(k=>`<tr>
      <td>${k.label||'--'}</td><td><code>${k.key.slice(0,16)}...</code></td><td>${k.quota}</td><td>${k.used}</td>
      <td>${k.quota-k.used}</td>
      <td><span class="badge ${k.enabled?'bg-on':'bg-off'}">${k.enabled?'启用':'禁用'}</span></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="tk('${k.id}',${!k.enabled})">${k.enabled?'禁用':'启用'}</button>
        <button class="btn btn-outline btn-sm" onclick="rq('${k.id}')">重置</button>
        <button class="btn btn-danger btn-sm" onclick="dk('${k.id}')">删除</button>
      </td></tr>`).join('')}catch(e){}
}
async function loadJobs(){
  try{const d=await call('listJobs');const g=document.getElementById('jobs-grid');
    if(!d.jobs?.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">暂无记录</div>';return}
    g.innerHTML=d.jobs.map(j=>`
      <div style="background:#1a1a2e;border-radius:10px;padding:10px;border:1px solid #2a2a4a;text-align:center">
        <div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">
          <img src="${j.imageUrl}" class="thumb" onclick="preview('${j.imageUrl}')" title="原图">
          ${j.resultUrl?`<img src="${j.resultUrl}" class="thumb" onclick="preview('${j.resultUrl}')" title="结果">`:`<div class="thumb" style="background:#222;display:flex;align-items:center;justify-content:center;color:#666;font-size:10px">处理中</div>`}
        </div>
        <span class="badge ${j.status==='done'?'bg-done':'bg-proc'}">${j.status==='done'?'✅完成':'⏳处理中'}</span>
        <div style="font-size:11px;color:#888;margin-top:4px">${j.keyId}</div>
        <div style="font-size:10px;color:#666">${new Date(j.createdAt).toLocaleString('zh-CN')}</div>
      </div>`).join('')}catch(e){}
}

function st(t){ct=t;
  document.querySelectorAll('.tab-content').forEach(d=>d.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');document.getElementById('nt-'+t).classList.add('active');
  if(t==='jobs')loadJobs()
}
function preview(url){document.getElementById('preview-img').src=url;document.getElementById('preview').classList.remove('hidden')}
function closePreview(){document.getElementById('preview').classList.add('hidden')}

async function addKey(){
  let k=document.getElementById('kf-key').value.trim();if(!k)k='sk-'+Math.random().toString(36).slice(2,14);
  await call('addKey',{key:k,label:document.getElementById('kf-label').value.trim(),quota:parseInt(document.getElementById('kf-quota').value)||100});
  hideAdd();loadKeys();loadStats();toast('✅ 密钥已生成')
}
function showAdd(){document.getElementById('kf-add').style.display='flex'}
function hideAdd(){document.getElementById('kf-add').style.display='none'}
async function tk(id,en){await call('updateKey',{id,enabled:en});loadKeys()}
async function rq(id){await call('updateKey',{id,resetUsed:true});loadKeys();loadStats();toast('✅ 已重置')}
async function dk(id){if(!confirm('确认删除？'))return;await call('deleteKey',{id});loadKeys();loadStats()}
async function clearJobs(){if(!confirm('确认清空所有记录？'))return;await call('clearJobs');loadJobs();loadStats();toast('🗑 已清空')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

// 启动
(async()=>{
  if(tok){try{await call('stats');showAdmin()}catch(e){logout()}}
  else{document.getElementById('login-page').classList.remove('hidden')}
})()
</script>
</body>
</html>
