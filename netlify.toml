[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."start-job"]
  timeout = 15

[functions."check-job"]
  timeout = 25

[functions."admin"]
  timeout = 10

[[redirects]]
  from = "/api/*"
  to = "https://api.myimg.ai/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, OPTIONS"
    Access-Control-Allow-Headers = "*"
